<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Me Energy Rush</title>
    <style>
        :root {
            --pink: #ffdae0;
            --dark-pink: #e30613;
            --white: #ffffff;
        }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background: #333;
            font-family: 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw; height: 100vh;
            max-width: 500px; margin: 0 auto;
            background: linear-gradient(to bottom, #fff0f3 0%, #ffffff 100%);
            overflow: hidden;
        }
        /* Mullide efekt taustal */
        .bubble {
            position: absolute;
            background: rgba(227, 6, 19, 0.1);
            border-radius: 50%;
            pointer-events: none;
            animation: rise 4s infinite ease-in;
        }
        @keyframes rise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        #ui-layer {
            position: absolute; top: 20px; left: 0; width: 100%;
            display: flex; justify-content: space-around;
            font-weight: bold; color: var(--dark-pink); z-index: 10;
        }

        #start-screen, #end-screen {
            position: absolute; inset: 0;
            background: rgba(255, 255, 255, 0.95);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 20; text-align: center; padding: 20px;
        }

        .btn {
            padding: 15px 40px; font-size: 20px;
            background: var(--dark-pink); color: white;
            border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(227, 6, 19, 0.3);
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }

        #pudel {
            position: absolute; bottom: 30px;
            width: 65px; height: 160px;
            transition: width 0.3s, height 0.3s;
            z-index: 15;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        .item {
            position: absolute; font-size: 30px;
            user-select: none; z-index: 12;
        }

        .turbo-active {
            filter: drop-shadow(0 0 15px #ffeb3b) !important;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer">
        <div>MÄNGIJA: <span id="p-name">-</span></div>
        <div>ENERGIA: <span id="p-score">0</span></div>
    </div>

    <div id="start-screen">
        <h1 style="color: var(--dark-pink); font-size: 40px;">For Me</h1>
        <p>Püüa häid vitamiine ja kofeiini!<br>Väldi pilvi ja tühje kaloreid.</p>
        <input type="text" id="name-input" placeholder="Sinu nimi" 
               style="padding: 12px; border-radius: 20px; border: 2px solid #ddd; margin-bottom: 20px; text-align: center;">
        <button class="btn" onclick="startGame()">ALUSTA MÄNGU</button>
    </div>

    <div id="end-screen" style="display: none;">
        <h2 id="congrats-title">VÄGEV TÖÖ!</h2>
        <p id="final-stats"></p>
        <button class="btn" onclick="startGame()">PROOVI UUESTI</button>
    </div>

    <div id="pudel">
        <svg viewBox="0 0 100 250" width="100%" height="100%">
            <rect x="30" y="0" width="40" height="15" rx="5" fill="#333" />
            <path d="M25 30 Q25 20 40 20 L60 20 Q75 20 75 30 L80 220 Q80 240 65 240 L35 240 Q20 240 20 220 Z" fill="#fff" stroke="#e30613" stroke-width="3" />
            <rect x="22" y="80" width="56" height="80" fill="#e30613" />
            <text x="50" y="125" text-anchor="middle" fill="white" font-size="16" font-weight="bold">For Me</text>
        </svg>
    </div>
</div>

<script>
    const container = document.getElementById('game-container');
    const pudel = document.getElementById('pudel');
    const scoreText = document.getElementById('p-score');
    const startScreen = document.getElementById('start-screen');
    const endScreen = document.getElementById('end-screen');
    
    let score = 0;
    let gameActive = false;
    let turbo = false;
    let playerName = "";

    // Mullide tekitamine taustale
    function createBubbles() {
        for(let i=0; i<15; i++) {
            let b = document.createElement('div');
            b.className = 'bubble';
            let size = Math.random() * 20 + 5;
            b.style.width = size + 'px';
            b.style.height = size + 'px';
            b.style.left = Math.random() * 100 + 'vw';
            b.style.animationDelay = Math.random() * 4 + 's';
            container.appendChild(b);
        }
    }
    createBubbles();

    // Liikumise loogika
    const move = (e) => {
        if(!gameActive) return;
        let x = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        let rect = container.getBoundingClientRect();
        let pos = x - rect.left - (pudel.offsetWidth / 2);
        
        if(pos < 0) pos = 0;
        if(pos > rect.width - pudel.offsetWidth) pos = rect.width - pudel.offsetWidth;
        
        pudel.style.left = pos + 'px';
    };

    container.addEventListener('mousemove', move);
    container.addEventListener('touchmove', (e) => { e.preventDefault(); move(e); }, {passive:false});

    function startGame() {
        playerName = document.getElementById('name-input').value || "Sõber";
        document.getElementById('p-name').innerText = playerName;
        score = 0;
        scoreText.innerText = score;
        startScreen.style.display = 'none';
        endScreen.style.display = 'none';
        gameActive = true;
        spawnItems();
    }

    function spawnItems() {
        if(!gameActive) return;

        const types = [
            { t: '💎', p: 10, c: 'Mg' },
            { t: '🍊', p: 10, c: 'Vit B' },
            { t: '⚡', p: 5, c: 'TURBO' }, // Kofeiini laks
            { t: '☁️', p: -20, c: 'Väsimus' },
            { t: '🍔', p: -30, c: 'Raske toit' }
        ];

        const data = types[Math.floor(Math.random() * types.length)];
        const el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = `<div style="font-size:10px; text-align:center;">${data.c}</div>${data.t}`;
        el.style.left = Math.random() * (container.offsetWidth - 40) + 'px';
        el.style.top = '-60px';
        container.appendChild(el);

        let speed = 4 + (score / 100); 
        let fall = setInterval(() => {
            if(!gameActive) { clearInterval(fall); el.remove(); return; }
            
            let top = parseFloat(el.style.top);
            el.style.top = (top + speed) + 'px';

            let pRect = pudel.getBoundingClientRect();
            let iRect = el.getBoundingClientRect();

            if(iRect.bottom > pRect.top && iRect.top < pRect.bottom && iRect.right > pRect.left && iRect.left < pRect.right) {
                clearInterval(fall);
                handleCollect(data);
                el.remove();
            }

            if(top > window.innerHeight) { clearInterval(fall); el.remove(); }
        }, 20);

        setTimeout(spawnItems, Math.max(300, 1000 - (score * 2)));
    }

    function handleCollect(item) {
        if(item.t === '⚡') {
            activateTurbo();
        }
        score += item.p;
        if(score < 0) score = 0;
        scoreText.innerText = score;

        if(score >= 500) { /* Võidulisand siia kui vaja */ }
        
        // Kui tabab suurt takistust ja skoor läheb nulli, võib mäng läbi saada
        // Aga teeme nii, et mäng kestab seni kuni mängija ise tahab või lisame aja
    }

    function activateTurbo() {
        turbo = true;
        pudel.classList.add('turbo-active');
        pudel.style.width = '90px';
        setTimeout(() => {
            turbo = false;
            pudel.classList.remove('turbo-active');
            pudel.style.width = '65px';
        }, 5000);
    }

    // Lisame "Lõpeta" nupu võimaluse või automaatse lõpu kui skoor on suur
    // Teen lihtsuse mõttes mängu lõpu kui skoor langeb alla -50 (siin näites skoor ei lähe alla 0)
    // Paneme siiski ühe "Game Over" tingimuse: kui tabad 3 pilve järjest vms. 
    // Aga teeme hetkel mängija jaoks "Lõpeta mäng" nupu (või sureb kui skoor on 0 ja saab miinuseid)
    
    function endGame() {
        gameActive = false;
        endScreen.style.display = 'flex';
        let message = score > 100 ? "Olid väga tubli, " : "Polnud viga, ";
        document.getElementById('congrats-title').innerText = message + playerName + "!";
        document.getElementById('final-stats').innerText = `Sinu energatase oli: ${score} punkti.`;
    }

    // Testimiseks: kui skoor on üle 1000, siis võit
    setInterval(() => {
        if(gameActive && score > 500) endGame();
    }, 1000);

</script>
</body>
</html>
